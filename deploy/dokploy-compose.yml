# JomForm production stack (Dokploy) — api + web + pg18 + valkey + minio
# All images local (built on host) or pinned public images.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jomform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jomform
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jomform -d jomform"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: jomform
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 jomform $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/jomform-media &&
      mc version enable local/jomform-media &&
      echo 'buckets ready'"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - internal

  api:
    image: jomform-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jomform:${POSTGRES_PASSWORD}@postgres:5432/jomform?sslmode=disable
      VALKEY_URL: valkey://valkey:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: jomform
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: jomform-media
      S3_REGION: us-east-1
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_BASE_URL: https://jomform.com
      APP_ENV: prod
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal

  web:
    image: jomform-web:latest
    restart: unless-stopped
    environment:
      JOMFORM_API_URL: http://api:8080
    depends_on:
      - api
    networks:
      - dokploy-network

volumes:
  pgdata:
  valkeydata:
  miniodata:

networks:
  dokploy-network:
    external: true
  internal: