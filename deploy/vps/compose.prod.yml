# JomForm production stack (Dokploy) — api + web + pg18 + valkey + S3 (SeaweedFS)
# All images local (built on host) or pinned public images.
#
# WHY SEAWEEDFS AND NOT MINIO (measured 2026-11-03). MinIO's community images are
# not published any more: `docker manifest inspect minio/minio:latest` and
# `minio/mc:latest` both answer `denied: requested access to the resource is
# denied` on Docker Hub, and `quay.io/minio/minio:latest` has no such manifest.
# A stack that names them cannot be stood up on a fresh host — `docker compose
# up` aborts at the pull, before anything starts — and the `minio-init` one-shot
# had the same problem with `minio/mc`. SeaweedFS is Apache-2.0, publishes a
# public image, and speaks the S3 API this stack needs (the same substitution
# deploy/docker-compose.yml made for the self-hosted install).
#
# THE BUCKET IS NOT PROVISIONED HERE. The API creates it at startup
# (objstore.EnsureBucket: HeadBucket → CreateBucket → PutBucketPolicy), so
# `minio-init` — the container that used to run `mc mb` — has nothing left to do.
#
# THE EXISTING HOST'S MEDIA IS NOT CONVERTED BY THIS FILE. MinIO and SeaweedFS do
# not share an on-disk format, so the `miniodata` volume is not readable by the
# new service: the objects have to be copied through the S3 API while the old
# server is still running. That is deploy/vps/migrate-media.sh, and it must be
# run BEFORE the first `up` of this file on an existing host — see
# deploy/HOST-SETUP.md § "Moving production off MinIO". A FRESH host needs none of
# it: there is no data, and the API creates the bucket.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jomform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jomform
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jomform -d jomform"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── object storage ────────────────────────────────────────────────────────
  # One process: master + volume + filer + the S3 gateway on 8333. The bucket is
  # created by the api at startup (see the header), so there is no init service.
  # The secrets are REQUIRED and fail closed (`:?`), so a host whose env file has
  # not been updated refuses to start instead of coming up with empty
  # credentials — which is how a half-finished migration would otherwise look.
  s3:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    # -ip.bind=0.0.0.0 so the compose network can reach it; without it the
    # services advertise 127.0.0.1 and the api's requests land on its own
    # loopback.
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
    environment:
      # The S3 identity the api authenticates as. Both sides read the same two
      # values, so they cannot drift into "the bucket exists but nobody may
      # write to it".
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required — see deploy/vps/.env.prod.example}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required — see deploy/vps/.env.prod.example}
    volumes:
      - s3data:/data
    networks:
      - internal
    healthcheck:
      # An UNSIGNED GET / answered with the S3 error document proves the S3
      # handler is serving, not merely that a socket is open: a port check would
      # pass while the filer is still starting, and the api would then fail its
      # one-shot bucket provisioning and disable uploads for good.
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8333/ | grep -q AccessDenied"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    image: jomform-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jomform:${POSTGRES_PASSWORD}@postgres:5432/jomform?sslmode=disable
      VALKEY_URL: valkey://valkey:6379/0
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required — see deploy/vps/.env.prod.example}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required — see deploy/vps/.env.prod.example}
      S3_BUCKET: jomform-media
      S3_REGION: us-east-1
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_BASE_URL: https://jomform.com
      SES_SMTP_HOST: ${SES_SMTP_HOST}
      SES_SMTP_PORT: ${SES_SMTP_PORT}
      SES_SMTP_USER: ${SES_SMTP_USER}
      SES_SMTP_PASS: ${SES_SMTP_PASS}
      SES_FROM: ${SES_FROM}
      SES_SNS_NOTIF_ENABLED: ${SES_SNS_NOTIF_ENABLED}
      APP_ENV: prod
      PORT: "8080"
      JF_CF_OAUTH_CLIENT_ID: ${JF_CF_OAUTH_CLIENT_ID}
      JF_CF_OAUTH_CLIENT_SECRET: ${JF_CF_OAUTH_CLIENT_SECRET}
      # Media purge → CDN edge invalidation. Optional but strongly recommended:
      # without them a purged media object keeps being served from Cloudflare's
      # edge until its (now bounded) freshness lifetime expires. The token needs
      # the Zone → Cache Purge permission on the zone the public media URLs live
      # in; see deploy/DEPLOY.md and scripts/media-purge-probe.sh. Empty = off.
      JF_CF_PURGE_TOKEN: ${JF_CF_PURGE_TOKEN}
      JF_CF_PURGE_ZONE_ID: ${JF_CF_PURGE_ZONE_ID}
      JF_CF_PURGE_HOSTS: ${JF_CF_PURGE_HOSTS}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      # The spam judge's own decision seam (same base URL/key as chat).
      SPAM_JUDGE_MODEL: ${SPAM_JUDGE_MODEL:-}
      SPAM_JUDGE_THRESHOLD: ${SPAM_JUDGE_THRESHOLD:-}
      JF_GOOGLE_CLIENT_ID: ${JF_GOOGLE_CLIENT_ID}
      JF_GOOGLE_CLIENT_SECRET: ${JF_GOOGLE_CLIENT_SECRET}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # The api provisions the bucket itself, but it needs the S3 endpoint to be
      # SERVING when it does: a failed EnsureBucket disables the media store for
      # the life of the process (uploads answer 503), so the api must not start
      # while the store is still coming up.
      s3:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal

  web:
    image: jomform-web:latest
    restart: unless-stopped
    environment:
      JOMFORM_API_URL: http://api:8080
    depends_on:
      - api
    networks:
      - dokploy-network

volumes:
  pgdata:
  valkeydata:
  # The object store's own data. NOT the old `miniodata`: that volume is MinIO's
  # on-disk format and this server cannot read it (see the header). It is left in
  # place, untouched, until the migration has been verified.
  s3data:

networks:
  dokploy-network:
    external: true
  internal:
