# JomForm production stack (Dokploy) — api + web + pg18 + valkey + S3 (RustFS)
# All images local (built on host) or pinned public images.
#
# THE OBJECT STORE IS RUSTFS, PINNED BY DIGEST (measured 2026-11-20):
#
#   rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
#
# The tag alone is not a pin — it can be re-pushed — so the digest is what this
# file ships: a `compose pull` on a fresh host cannot move the store under the
# data. 1.0.6 is the version verified on staging and then on production against
# the four S3 operations this app actually performs (PutObject / GetObject /
# DeleteObject / HeadObject), and against a real asset fetched through
# https://jomform.com/media/... after the media copy (byte-identical).
#
# WHY NOT THE STORE THIS FILE USED TO NAME. The community MinIO images are no
# longer published (source-only since Oct 2025), so `docker compose up` on a
# compose that names them aborts at the PULL on a fresh host, before anything
# starts — and a stack that names an image nobody can pull is not deployable.
# Every object-store image in this file must be digest-pinned; that is enforced
# by api/internal/objstore/compose_store_pin_test.go, not by this comment.
#
# THE BUCKET IS NOT PROVISIONED HERE. The API creates it at startup
# (objstore.EnsureBucket: HeadBucket → CreateBucket → PutBucketPolicy), so the
# one-shot `mc` init container this stack used to carry has nothing left to do.
# RustFS needs no init container. Bucket VERSIONING IS OFF on purpose: the app
# never calls the versioning APIs.
#
# THE EXISTING HOST'S MEDIA IS NOT CONVERTED BY THIS FILE. Two stores do not
# share an on-disk format, so the previous store's volume is not readable by
# `rustfs`: the objects have to be copied through the S3 API while the old
# server is still running. That is deploy/vps/migrate-media.sh, and it must be
# run BEFORE the first `up` of this file on an existing host — see
# deploy/HOST-SETUP.md § "Moving production onto RustFS". A FRESH host needs none
# of it: there is no data, and the API creates the bucket.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jomform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jomform
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jomform -d jomform"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── object storage ────────────────────────────────────────────────────────
  # One process: the S3 API on 9000 over one local volume. The bucket is created
  # by the api at startup (see the header), so there is no init service.
  # INTERNAL ONLY — it is on `internal` and not on `dokploy-network`, so nothing
  # routes to it from outside; media is served by the api's /media/ route.
  # The secrets are REQUIRED and fail closed (`:?`), so a host whose env file has
  # not been updated refuses to start instead of coming up with empty
  # credentials — which is how a half-finished migration would otherwise look.
  rustfs:
    # PINNED BY DIGEST (see the header). The tag names the version a human
    # verified; the digest is what ships.
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: unless-stopped
    environment:
      # The S3 identity the api authenticates as. Both sides read the same two
      # values, so they cannot drift into "the bucket exists but nobody may
      # write to it".
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required — see deploy/vps/.env.prod.example}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required — see deploy/vps/.env.prod.example}
      # 0.0.0.0, not 127.0.0.1: bound to loopback the api's requests would land
      # on the api container's own loopback instead of this one.
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      # The web console is a second listener with its own auth surface. Nothing
      # here needs it and it is not routed, so it stays off.
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfsdata:/data
    networks:
      - internal
    healthcheck:
      # An UNSIGNED GET / answered with the S3 error document proves the S3
      # handler is serving, not merely that a socket is open: a port check would
      # pass while the store is still initialising, and the api would then fail
      # its one-shot bucket provisioning and disable uploads for good.
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9000/ | grep -q AccessDenied"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    image: jomform-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jomform:${POSTGRES_PASSWORD}@postgres:5432/jomform?sslmode=disable
      VALKEY_URL: valkey://valkey:6379/0
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required — see deploy/vps/.env.prod.example}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required — see deploy/vps/.env.prod.example}
      S3_BUCKET: jomform-media
      S3_REGION: us-east-1
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_BASE_URL: https://jomform.com
      SES_SMTP_HOST: ${SES_SMTP_HOST}
      SES_SMTP_PORT: ${SES_SMTP_PORT}
      SES_SMTP_USER: ${SES_SMTP_USER}
      SES_SMTP_PASS: ${SES_SMTP_PASS}
      SES_FROM: ${SES_FROM}
      SES_SNS_NOTIF_ENABLED: ${SES_SNS_NOTIF_ENABLED}
      APP_ENV: prod
      PORT: "8080"
      JF_CF_OAUTH_CLIENT_ID: ${JF_CF_OAUTH_CLIENT_ID}
      JF_CF_OAUTH_CLIENT_SECRET: ${JF_CF_OAUTH_CLIENT_SECRET}
      # Media purge → CDN edge invalidation. Optional but strongly recommended:
      # without them a purged media object keeps being served from Cloudflare's
      # edge until its (now bounded) freshness lifetime expires. The token needs
      # the Zone → Cache Purge permission on the zone the public media URLs live
      # in; see deploy/DEPLOY.md and scripts/media-purge-probe.sh. Empty = off.
      JF_CF_PURGE_TOKEN: ${JF_CF_PURGE_TOKEN}
      JF_CF_PURGE_ZONE_ID: ${JF_CF_PURGE_ZONE_ID}
      JF_CF_PURGE_HOSTS: ${JF_CF_PURGE_HOSTS}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      # The spam judge's own decision seam (same base URL/key as chat).
      SPAM_JUDGE_MODEL: ${SPAM_JUDGE_MODEL:-}
      SPAM_JUDGE_THRESHOLD: ${SPAM_JUDGE_THRESHOLD:-}
      JF_GOOGLE_CLIENT_ID: ${JF_GOOGLE_CLIENT_ID}
      JF_GOOGLE_CLIENT_SECRET: ${JF_GOOGLE_CLIENT_SECRET}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # The api provisions the bucket itself, but it needs the S3 endpoint to be
      # SERVING when it does: a failed EnsureBucket disables the media store for
      # the life of the process (uploads answer 503), so the api must not start
      # while the store is still coming up.
      rustfs:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal

  web:
    image: jomform-web:latest
    restart: unless-stopped
    environment:
      JOMFORM_API_URL: http://api:8080
    depends_on:
      - api
    networks:
      - dokploy-network

volumes:
  pgdata:
  valkeydata:
  # The object store's own data. NOT the volume the previous store used: that
  # one is a different on-disk format this server cannot read (see the header).
  # It is deliberately NOT declared here — an undeclared volume is never removed
  # by `docker compose down -v` — so it stays in place, untouched, on the
  # existing host until the media has been exercised through RustFS.
  rustfsdata:

networks:
  dokploy-network:
    external: true
  internal:
