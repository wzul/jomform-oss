services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    # 2026-10-20: the Docker provider was REMOVED from this file — the two
    # docker-provider command flags and the read-only Docker daemon control socket
    # mount that fed it are gone (the host keeps a pre-change backup,
    # docker-compose.yml.bak-dockerprovider-20261020T095555Z). It never worked: the
    # Go Docker SDK pinned inside traefik:v3.3 speaks API 1.24 while Docker Engine
    # 29.1.3 requires >= 1.44, so the daemon refused the handshake and the provider
    # retried forever — ~2 ERR lines/s of log and not one container discovered.
    # Routing here is 100% the FILE provider (/opt/traefik/dynamic; every router is
    # @file) and no container carries a traefik.* label, so nothing was lost.
    # Bringing label discovery back is a deliberate change: traefik >= v3.6.1, the
    # first release whose Docker client auto-negotiates the API version (v3.5.x and
    # older still send 1.24, and pinning DOCKER_API_VERSION does not help — the SDK
    # refuses the handshake before that variable is consulted) — PLUS restoring both
    # flags and the socket mount. Their absence is intentional, not an accident.
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --certificatesresolvers.le.acme.email=owner00@example.com
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/traefik/dynamic:/etc/traefik/dynamic:ro
      - /opt/traefik/acme:/acme
    networks: [jomform_internal, dokploy-network]
networks:
  dokploy-network:
    external: true
  jomform_internal:
    external: true
