name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — build, vet, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      # setup-go resolves go-version-file (and cache-dependency-path)
      # relative to $GITHUB_WORKSPACE, NOT to defaults.run.working-directory
      # — defaults only apply to `run` steps. So the api/ prefix is correct
      # here: setup runs at the workspace root, then the Vet/Test steps run
      # inside api/.
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  web:
    name: Web — build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
