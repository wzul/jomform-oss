name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — build, vet, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  web:
    name: Web — build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install & build
        run: |
          if [ -d web ]; then cd web && (npm ci || echo "web not scaffolded yet") && (npm run build || true); else echo "web not scaffolded yet"; fi