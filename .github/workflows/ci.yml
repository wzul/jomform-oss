name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  api:
    name: API — build, vet, test, vuln scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # Issue #98: run the integration suite against real Postgres + Valkey so
    # the regression tests are exercised in CI, not skipped. The test fixtures
    # apply migrations themselves and skip only when these env vars are unset.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jomform
          POSTGRES_PASSWORD: jomform_dev
          POSTGRES_DB: jomform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jomform -d jomform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JOMFORM_TEST_DATABASE_URL: postgres://jomform:***@localhost:5432/jomform_test?sslmode=disable
      JOMFORM_TEST_VALKEY_URL: valkey://localhost:6379/1
    steps:
      - uses: actions/checkout@v7

      # setup-go resolves go-version-file (and cache-dependency-path)
      # relative to $GITHUB_WORKSPACE, NOT to defaults.run.working-directory
      # — defaults only apply to `run` steps. So the api/ prefix is correct
      # here: setup runs at the workspace root, then the Vet/Test steps run
      # inside api/.
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Vet
        run: go vet ./...

      # The migration/scan-drift guard (TestSelectScanColumnAlignment,
      # TestMigrationColumnsAppearInSelect) is a pure static check and always
      # runs. The data-integrity + migration integration tests (issue #102)
      # need a real Postgres; JOMFORM_TEST_DATABASE_URL points at the service
      # above so they run in CI too (migrations applied first, mirroring prod).
      - name: Test
        env:
          JOMFORM_TEST_DATABASE_URL: postgres://jomform:jomform_dev@localhost:5432/jomform_test?sslmode=disable
        run: go test ./... -race

      # Issue #101: dependency vulnerability scan — fail on any known vuln
      # in the module graph. Required gate; never skip with `|| true`.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    name: Web — build check + npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan (axe-core)
        run: npm run a11y

      # Issue #101: dependency vulnerability scan — fail on high/critical.
      # Required gate; never skip with `|| true` or `continue-on-error`.
      - name: npm audit
        run: npm audit --audit-level=high

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Scan the full history, not just the tip, so secrets already
          # committed are caught (repo will go public — issue #74).
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod

      # Run the gitleaks binary directly (no SARIF upload) — the
      # gitleaks-action@v2 SARIF upload hits "Resource not accessible by
      # integration" on PR events. A plain `gitleaks detect` fails the job on
      # any leak, which is the required gate.
      - name: gitleaks
        run: |
          go run github.com/zricethezav/gitleaks/v8@latest detect --source . --no-banner --redact --config .gitleaks.toml
