<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="JomForm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- form sheet -->
  <rect x="132" y="104" width="248" height="304" rx="32" fill="url(#sheet)"/>
  <!-- JF monogram -->
  <text x="256" y="292" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="132" font-weight="800" fill="#4f46e5" text-anchor="middle" letter-spacing="-4">JF</text>
  <!-- form lines -->
  <rect x="176" y="336" width="160" height="14" rx="7" fill="#c7d2fe"/>
  <rect x="176" y="362" width="104" height="14" rx="7" fill="#e0e7ff"/>
