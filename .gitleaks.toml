# gitleaks config — the default secret rules, minus the known-good test fixtures.
#
# ⚠️  [extend] useDefault = true is REQUIRED, do not remove it.
#
# Supplying `--config <this file>` REPLACES gitleaks' embedded default ruleset
# with the file's contents. This file defines only an [allowlist] and no
# [[rules]], so without [extend] the scan runs with an EMPTY ruleset: nothing
# can ever match, `gitleaks detect` always exits 0, and the secrets gate is a
# permanent green no-op that looks exactly like a clean history.
#
# That is not hypothetical — it is how this repo's gitleaks gate behaved until
# 2026-09-19. Verified against a standalone repo: with the old config a GitHub
# PAT, an AWS secret key and an OpenSSH private key were ALL missed (rc=0); with
# [extend] useDefault = true all three are caught (rc=1), and the allowlist
# below still suppresses the historical false positive.
#
# The allowlist entries are the fixtures that legitimately contain secret-shaped
# strings (a `SESSION_SECRET: "x"` test fixture and similar). They are scoped by
# PATH so a real secret in a non-test file is still reported.
#
# The two web entries are BOTH needed and neither implies the other: `web/**/*.test.*`
# is the vitest unit tests and `web/**/*.spec.*` is the Playwright e2e/feature specs
# (`web/e2e/*.spec.ts`). The e2e specs carry deliberately token-shaped fixtures —
# `await page.goto("/magic-link?token=…")` — which the `generic-api-key` rule matches
# at entropy 4.0, and `gitleaks detect --source .` scans EVERY ref, not just the tree
# under test. So a spec fixture that is not allowlisted reds the `gitleaks` gate for
# every worktree and every candidate tree in the repo (measured 2026-10-11: an e2e
# fixture pushed on one feature branch failed the gate on all of them, including
# trees whose own diff could not possibly contain it). Keep the entries
# PATH-scoped: widening them to `web/` would stop a real secret in `web/src/` being
# reported, which is half the reason the list exists.
[extend]
  useDefault = true

[allowlist]
  description = "Test fixtures and non-secret placeholders"
  paths = [
    '''api/internal/config/config_test\.go''',
    '''api/internal/.*_test\.go''',
    '''web/.*\.test\.(ts|tsx|js|jsx)''',
    '''web/.*\.spec\.(ts|tsx|js|jsx)''',
  ]
  regexes = [
    '''SESSION_SECRET["']?\s*[:=]\s*["']x["']''',
    '''ENCRYPTION_KEY["']?\s*[:=]\s*["']short["']''',
  ]
